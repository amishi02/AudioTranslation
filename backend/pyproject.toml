[project]
name = "realtime-translation-backend"
version = "0.1.0"
description = "Real-Time Audio Translation API"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "numpy"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = ["slow: marks tests as slow (real model)"]
